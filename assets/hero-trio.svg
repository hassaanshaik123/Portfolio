<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" fill="none" aria-label="Illustration: Muhammad Hassaan standing between a majestic lion and a lion cub on a mountain peak">
  <defs>
    <!-- Warm Paper Canvas Lighting -->
    <radialGradient id="canvasGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f7f7f5" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f2f2ee" stop-opacity="0"/>
    </radialGradient>

    <!-- Mountain Rock Gradients (Warm Editorial Granite) -->
    <linearGradient id="rockBaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d404d"/>
      <stop offset="50%" stop-color="#2a2c36"/>
      <stop offset="100%" stop-color="#1c1d24"/>
    </linearGradient>

    <linearGradient id="rockFacetLight" x1="0%" y1="0%" x2="100%" y2="40%">
      <stop offset="0%" stop-color="#73778c"/>
      <stop offset="100%" stop-color="#4b4f61"/>
    </linearGradient>

    <!-- Lion Warm Golden Tones -->
    <linearGradient id="lionBodyGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#d99943"/>
      <stop offset="50%" stop-color="#b87b28"/>
      <stop offset="100%" stop-color="#805016"/>
    </linearGradient>

    <linearGradient id="lionManeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8c4718"/>
      <stop offset="45%" stop-color="#5a2608"/>
      <stop offset="100%" stop-color="#2e1103"/>
    </linearGradient>

    <!-- Hassaan Old-Money Camel Coat & Tailoring -->
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#caa57a"/>
      <stop offset="45%" stop-color="#a88052"/>
      <stop offset="100%" stop-color="#7a5832"/>
    </linearGradient>

    <linearGradient id="trouserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c2d38"/>
      <stop offset="100%" stop-color="#16171d"/>
    </linearGradient>

    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfa880"/>
      <stop offset="100%" stop-color="#bd8259"/>
    </linearGradient>

    <!-- Cub Golden Gradient -->
    <linearGradient id="cubBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8af5c"/>
      <stop offset="60%" stop-color="#c48a34"/>
      <stop offset="100%" stop-color="#915b18"/>
    </linearGradient>

    <!-- Soft Ambient Ground Shadow -->
    <radialGradient id="baseShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Light Center Halo -->
  <ellipse cx="500" cy="380" rx="420" ry="200" fill="url(#canvasGlow)" />

  <!-- Mountain Peak Crag Structure -->
  <g id="mountainPeak">
    <!-- Base Plateau Shadow -->
    <ellipse cx="500" cy="540" rx="440" ry="35" fill="url(#baseShadow)" />

    <!-- Cliff Formation Facets -->
    <polygon points="100,580 180,505 340,490 500,480 660,490 820,505 900,580 500,600" fill="url(#rockBaseGrad)" />
    <!-- Upper Top Ledge -->
    <polygon points="170,510 320,490 500,480 680,490 830,510 760,535 240,535" fill="url(#rockFacetLight)" />
    <!-- Distinct Facet Planes for Depth -->
    <polygon points="320,490 500,480 500,520 330,525" fill="#585c6e" />
    <polygon points="500,480 680,490 670,525 500,520" fill="#3f4250" />

    <!-- Organic Rock Crack Lines -->
    <path d="M 270 515 L 290 550 L 310 590" stroke="#22242c" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 495 510 L 505 555 L 495 600" stroke="#22242c" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 720 515 L 705 550 L 715 595" stroke="#22242c" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- ================= LEFT: MAJESTIC ADULT LION ================= -->
  <g id="adultLion" transform="translate(45, 10)">
    <!-- Lion Soft Shadow -->
    <ellipse cx="230" cy="500" rx="95" ry="18" fill="url(#baseShadow)" />

    <!-- Tufted Tail -->
    <path d="M 155 450 C 115 460, 105 495, 130 510 C 145 518, 155 505, 150 495" fill="none" stroke="#a66e27" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="152" cy="493" rx="9" ry="6" fill="#4d240a"/>

    <!-- Lion Body (Sitting Nobly) -->
    <path d="M 165 450 C 155 395, 195 350, 235 345 C 265 343, 285 365, 295 405 L 275 490 L 235 495 L 215 460 Z" fill="url(#lionBodyGrad)"/>
    <ellipse cx="198" cy="475" rx="32" ry="22" fill="#9e6623"/>
    <path d="M 180 485 C 180 472, 218 472, 222 490 C 222 497, 180 498, 180 485 Z" fill="#b87b28"/>

    <!-- Strong Forelegs & Chest -->
    <path d="M 245 365 C 265 365, 312 385, 316 430 L 306 492 C 306 498, 284 500, 278 492 L 268 435 Z" fill="url(#lionBodyGrad)"/>
    <path d="M 240 405 L 240 492 C 240 498, 218 498, 218 492 L 226 415 Z" fill="#9e6623"/>
    <!-- Paws -->
    <path d="M 272 488 Q 292 484 308 490 Q 308 498 274 497 Z" fill="#c99144"/>
    <path d="M 215 488 Q 230 484 242 490 Q 242 498 217 497 Z" fill="#b87b28"/>

    <!-- Layered Regal Mane -->
    <path d="M 205 305 C 165 295, 145 365, 175 415 C 195 445, 245 455, 295 435 C 335 415, 350 345, 325 295 C 305 255, 245 245, 205 305 Z" fill="url(#lionManeGrad)"/>
    <!-- Mane Locks & Silhouette -->
    <path d="M 165 345 Q 145 375 175 390 Q 155 415 195 430 Q 225 455 265 445 Q 305 450 330 420 Q 355 385 335 355 Q 350 315 320 295 Q 290 255 245 265 Q 195 270 175 305 Z" fill="#4d240a"/>
    <path d="M 190 320 C 180 350, 190 390, 220 410 C 250 430, 290 420, 310 390 C 325 360, 315 325, 295 300 C 270 280, 215 290, 190 320 Z" fill="#7a3e14"/>

    <!-- Head -->
    <g id="lionFace" transform="translate(210, 260)">
      <!-- Ears -->
      <circle cx="20" cy="25" r="13" fill="#582a0d"/>
      <circle cx="20" cy="25" r="7" fill="#d99943"/>
      <circle cx="85" cy="25" r="13" fill="#582a0d"/>
      <circle cx="85" cy="25" r="7" fill="#d99943"/>

      <!-- Cranium -->
      <path d="M 22 45 Q 52 20 82 45 Q 92 75 80 100 Q 52 118 24 100 Q 12 75 22 45 Z" fill="url(#lionBodyGrad)"/>
      <!-- Brow -->
      <path d="M 32 45 Q 52 35 72 45" stroke="#fce5b3" stroke-width="2.5" fill="none" opacity="0.7"/>

      <!-- Muzzle -->
      <path d="M 35 80 Q 52 75 70 80 Q 78 100 52 104 Q 26 100 35 80 Z" fill="#ebd2a9"/>
      <ellipse cx="43" cy="88" rx="9" ry="6" fill="#f0dbb8"/>
      <ellipse cx="61" cy="88" rx="9" ry="6" fill="#f0dbb8"/>

      <!-- Nose -->
      <polygon points="46,75 58,75 52,85" fill="#2d170b"/>
      <line x1="52" y1="85" x2="52" y2="94" stroke="#2d170b" stroke-width="2"/>

      <!-- Eyes (Regal, Amber) -->
      <polygon points="34,60 44,57 42,65 32,64" fill="#1b1208"/>
      <circle cx="38" cy="61" r="2.5" fill="#e0a13c"/>
      <circle cx="39" cy="60" r="1" fill="#ffffff"/>

      <polygon points="70,60 60,57 62,65 72,64" fill="#1b1208"/>
      <circle cx="66" cy="61" r="2.5" fill="#e0a13c"/>
      <circle cx="65" cy="60" r="1" fill="#ffffff"/>

      <!-- Chin Beard -->
      <path d="M 45 102 Q 52 115 59 102 Z" fill="#f7e6ce"/>
    </g>
  </g>

  <!-- ================= CENTER: MUHAMMAD HASSAAN (OLD-MONEY TAILORING) ================= -->
  <g id="hassaanCenter" transform="translate(420, 95)">
    <!-- Shadow -->
    <ellipse cx="80" cy="395" rx="55" ry="12" fill="url(#baseShadow)"/>

    <!-- Polished Oxfords / Dress Shoes -->
    <g id="shoes">
      <path d="M 45 385 C 45 380, 62 380, 70 385 C 74 389, 72 395, 52 396 C 40 396, 43 390, 45 385 Z" fill="#1c1917"/>
      <path d="M 47 384 Q 58 381 68 385" stroke="#5a493e" stroke-width="1.2" fill="none"/>

      <path d="M 88 385 C 88 380, 105 380, 113 385 C 117 389, 115 395, 95 396 C 83 396, 86 390, 88 385 Z" fill="#1c1917"/>
      <path d="M 90 384 Q 101 381 111 385" stroke="#5a493e" stroke-width="1.2" fill="none"/>
    </g>

    <!-- Tailored Charcoal Pleated Trousers -->
    <g id="trousers">
      <path d="M 43 265 L 47 385 L 70 385 L 78 280 L 82 280 L 90 385 L 113 385 L 117 265 Z" fill="url(#trouserGrad)"/>
      <!-- Sharp Center Creases -->
      <line x1="57" y1="275" x2="57" y2="382" stroke="#484a59" stroke-width="1.2"/>
      <line x1="102" y1="275" x2="102" y2="382" stroke="#484a59" stroke-width="1.2"/>
    </g>

    <!-- Dark Mock-Neck / Fine Knitwear -->
    <path d="M 68 108 L 92 108 L 94 138 L 66 138 Z" fill="#1e2028"/>
    <line x1="68" y1="120" x2="92" y2="120" stroke="#333642" stroke-width="1"/>

    <!-- Double-Breasted Tailored Camel Overcoat -->
    <g id="overcoat">
      <!-- Main Coat -->
      <path d="M 32 138 C 45 123, 115 123, 128 138 L 136 290 C 136 295, 115 300, 80 300 C 45 300, 24 295, 24 290 Z" fill="url(#coatGrad)"/>
      
      <!-- Lapels -->
      <polygon points="38,138 68,138 80,205 50,172 35,178" fill="#bc966e"/>
      <polygon points="50,172 80,205 65,255 48,215" fill="#967248"/>

      <polygon points="122,138 92,138 80,205 110,172 125,178" fill="#ceb292"/>
      <polygon points="110,172 80,205 95,255 112,215" fill="#967248"/>

      <!-- Center Seam & Buttons -->
      <line x1="80" y1="205" x2="80" y2="299" stroke="#5d4223" stroke-width="1.5"/>
      <circle cx="75" cy="220" r="3" fill="#2d1c0e" stroke="#8c6436" stroke-width="1"/>
      <circle cx="75" cy="240" r="3" fill="#2d1c0e" stroke="#8c6436" stroke-width="1"/>
      <circle cx="75" cy="260" r="3" fill="#2d1c0e" stroke="#8c6436" stroke-width="1"/>

      <!-- Silk Pocket Square -->
      <path d="M 100 190 L 112 190 L 112 193 L 100 193 Z" fill="#3a2517"/>
      <polygon points="102,190 106,183 110,190" fill="#f7f5f0"/>

      <!-- Arms / Sleeves -->
      <path d="M 32 138 C 20 158, 16 208, 22 248 L 36 248 C 32 213, 34 173, 42 146 Z" fill="#8f6c44"/>
      <path d="M 22 248 C 20 258, 26 266, 32 266 C 36 266, 38 258, 36 248 Z" fill="url(#skinGrad)"/>

      <path d="M 128 138 C 140 158, 144 208, 138 248 L 124 248 C 128 213, 126 173, 118 146 Z" fill="#aa855a"/>
      <!-- Gold Watch Cuff -->
      <rect x="123" y="245" width="14" height="4" rx="1.5" fill="#d4af37"/>
      <path d="M 124 249 C 122 259, 130 266, 136 264 C 140 262, 140 256, 138 249 Z" fill="url(#skinGrad)"/>
    </g>

    <!-- Head & Grooming -->
    <g id="head">
      <!-- Neck -->
      <rect x="71" y="94" width="18" height="18" rx="4" fill="url(#skinGrad)"/>
      <path d="M 71 104 Q 80 112 89 104" stroke="#a36b47" stroke-width="1.2" fill="none"/>

      <!-- Face -->
      <path d="M 64 63 C 64 46, 96 46, 96 63 C 96 80, 88 96, 80 96 C 72 96, 64 80, 64 63 Z" fill="url(#skinGrad)"/>

      <!-- Hair -->
      <path d="M 62 60 C 60 42, 76 32, 92 34 C 98 35, 100 43, 98 54 C 94 46, 88 42, 80 41 C 70 40, 64 48, 62 60 Z" fill="#1f1a16"/>

      <!-- Neat Beard & Stubble -->
      <path d="M 66 74 C 68 88, 74 95, 80 95 C 86 95, 92 88, 94 74 C 91 83, 85 89, 80 89 C 75 89, 69 83, 66 74 Z" fill="#2d231c"/>

      <!-- Eyes & Features -->
      <path d="M 68 60 Q 74 57 78 60" stroke="#1c1612" stroke-width="2" stroke-linecap="round"/>
      <path d="M 82 60 Q 86 57 92 60" stroke="#1c1612" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="73" cy="65" rx="3" ry="1.8" fill="#1c1612"/>
      <circle cx="74" cy="64.5" r="0.8" fill="#ffffff"/>
      <ellipse cx="87" cy="65" rx="3" ry="1.8" fill="#1c1612"/>
      <circle cx="88" cy="64.5" r="0.8" fill="#ffffff"/>

      <path d="M 80 62 L 79 72 L 83 72" stroke="#99623e" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <path d="M 75 78 Q 80 80 85 78" stroke="#683d22" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ================= RIGHT: ATTENTIVE LION CUB ================= -->
  <g id="lionCub" transform="translate(685, 150)">
    <!-- Cub Soft Shadow -->
    <ellipse cx="110" cy="360" rx="60" ry="14" fill="url(#baseShadow)"/>

    <!-- Tail -->
    <path d="M 160 320 C 195 315, 205 275, 195 260 C 188 250, 178 265, 185 275" fill="none" stroke="#c48a34" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="186" cy="275" r="5.5" fill="#582a0d"/>

    <!-- Body -->
    <path d="M 85 290 C 65 300, 55 330, 75 355 L 145 355 C 160 335, 155 300, 130 290 Z" fill="url(#cubBodyGrad)"/>
    <ellipse cx="75" cy="345" rx="20" ry="12" fill="#ab7429"/>
    <path d="M 60 352 Q 78 348 92 354 Q 92 360 65 360 Z" fill="#d99f48"/>

    <!-- Forelegs -->
    <path d="M 105 285 L 105 354 C 105 359, 122 359, 122 354 L 122 285 Z" fill="#c48a39"/>
    <path d="M 125 285 L 128 354 C 128 359, 145 359, 145 354 L 140 285 Z" fill="#bd8536"/>
    <ellipse cx="113" cy="356" rx="9" ry="5" fill="#e0a955"/>
    <ellipse cx="136" cy="356" rx="9" ry="5" fill="#e0a955"/>

    <!-- Light Chest Fur -->
    <path d="M 98 270 Q 120 270 132 310 Q 115 330 100 310 Z" fill="#faebd0"/>

    <!-- Head -->
    <g id="cubHead" transform="translate(85, 195)">
      <circle cx="18" cy="22" r="13" fill="#693710"/>
      <circle cx="18" cy="22" r="7" fill="#e8ba74"/>
      <circle cx="68" cy="20" r="13" fill="#693710"/>
      <circle cx="68" cy="20" r="7" fill="#e8ba74"/>

      <circle cx="43" cy="46" r="30" fill="url(#cubBodyGrad)"/>
      <ellipse cx="43" cy="40" rx="24" ry="18" fill="#d99f48"/>

      <ellipse cx="34" cy="56" rx="11" ry="7" fill="#faebd0"/>
      <ellipse cx="52" cy="56" rx="11" ry="7" fill="#faebd0"/>
      <polygon points="40,50 46,50 43,56" fill="#4d240d"/>
      <line x1="43" y1="56" x2="43" y2="61" stroke="#4d240d" stroke-width="1.5"/>

      <!-- Large Curious Eyes -->
      <ellipse cx="31" cy="40" rx="5" ry="6" fill="#24150b"/>
      <circle cx="31" cy="40" r="3.8" fill="#d48c28"/>
      <circle cx="32" cy="38" r="1.8" fill="#000000"/>
      <circle cx="33" cy="37" r="1.1" fill="#ffffff"/>

      <ellipse cx="55" cy="39" rx="5" ry="6" fill="#24150b"/>
      <circle cx="55" cy="39" r="3.8" fill="#d48c28"/>
      <circle cx="56" cy="37" r="1.8" fill="#000000"/>
      <circle cx="57" cy="36" r="1.1" fill="#ffffff"/>
    </g>
  </g>
</svg>
